<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad365" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#152438"/>
      <stop offset="60%" stop-color="#0a1017"/>
      <stop offset="100%" stop-color="#05070a"/>
    </radialGradient>

    <!-- Microsoft 365 Core Gradient -->
    <linearGradient id="m365BoxFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0078d4"/>
      <stop offset="30%" stop-color="#107c41"/>
      <stop offset="70%" stop-color="#d83b01"/>
      <stop offset="100%" stop-color="#ea3e2e"/>
    </linearGradient>

    <linearGradient id="boxShadowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow365" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0078d4" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop -->
  <rect width="600" height="600" rx="24" fill="url(#bgGrad365)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="rgba(156,195,46,0.08)" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="600"/>
    <line x1="150" y1="0" x2="150" y2="600"/>
    <line x1="250" y1="0" x2="250" y2="600"/>
    <line x1="350" y1="0" x2="350" y2="600"/>
    <line x1="450" y1="0" x2="450" y2="600"/>
    <line x1="550" y1="0" x2="550" y2="600"/>
    <line x1="0" y1="100" x2="600" y2="100"/>
    <line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="400" x2="600" y2="400"/>
    <line x1="0" y1="500" x2="600" y2="500"/>
  </g>

  <!-- Ground Pedestal Glow -->
  <ellipse cx="300" cy="510" rx="190" ry="32" fill="#0078d4" opacity="0.25" filter="url(#neonGlow365)"/>
  <ellipse cx="300" cy="510" rx="140" ry="18" fill="#9ec32e" opacity="0.15"/>

  <!-- 3D Perspective Box Package -->
  <g filter="url(#softShadow)" transform="translate(140, 85)">
    <!-- Box Left Spine -->
    <polygon points="0,55 70,0 70,360 0,405" fill="#0d1b2a" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <!-- Spine Text / Logo -->
    <g transform="translate(35, 230) rotate(-90)">
      <text fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="700" letter-spacing="3" text-anchor="middle">MICROSOFT 365</text>
    </g>

    <!-- Box Front Face -->
    <polygon points="70,0 320,35 320,395 70,360" fill="#111d2e" stroke="rgba(0,120,212,0.4)" stroke-width="2"/>

    <!-- Front Face Gradient Accent Overlay -->
    <path d="M70,0 L320,35 L320,180 L70,220 Z" fill="url(#m365BoxFront)" opacity="0.92"/>

    <!-- Microsoft 4-Color Grid Icon -->
    <g transform="translate(100, 30)">
      <rect x="0" y="0" width="16" height="16" fill="#f25022"/>
      <rect x="19" y="0" width="16" height="16" fill="#7fba00"/>
      <rect x="0" y="19" width="16" height="16" fill="#00a4ef"/>
      <rect x="19" y="19" width="16" height="16" fill="#ffb900"/>
      <text x="46" y="26" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="600" letter-spacing="0.5">Microsoft</text>
    </g>

    <!-- Product Title -->
    <text x="100" y="110" fill="#ffffff" font-family="system-ui, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">365</text>
    <text x="100" y="138" fill="rgba(255,255,255,0.85)" font-family="system-ui, sans-serif" font-size="14" font-weight="500">Personal / Familia · Suscripción</text>

    <!-- Badges Row -->
    <g transform="translate(100, 160)">
      <rect x="0" y="0" width="90" height="22" rx="4" fill="rgba(0,0,0,0.4)"/>
      <text x="45" y="15" fill="#9ec32e" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">1 TB CLOUD</text>

      <rect x="98" y="0" width="95" height="22" rx="4" fill="rgba(0,0,0,0.4)"/>
      <text x="145" y="15" fill="#ffffff" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">5 EQUIPOS</text>
    </g>

    <!-- App Badges on Front Face -->
    <g transform="translate(95, 255)">
      <!-- Word -->
      <g transform="translate(0, 0)">
        <rect width="36" height="36" rx="8" fill="#185abd"/>
        <text x="18" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle">W</text>
      </g>
      <!-- Excel -->
      <g transform="translate(44, 0)">
        <rect width="36" height="36" rx="8" fill="#107c41"/>
        <text x="18" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle">X</text>
      </g>
      <!-- PowerPoint -->
      <g transform="translate(88, 0)">
        <rect width="36" height="36" rx="8" fill="#c43e1c"/>
        <text x="18" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle">P</text>
      </g>
      <!-- Outlook -->
      <g transform="translate(132, 0)">
        <rect width="36" height="36" rx="8" fill="#0078d4"/>
        <text x="18" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle">O</text>
      </g>
      <!-- OneDrive -->
      <g transform="translate(176, 0)">
        <rect width="36" height="36" rx="8" fill="#004e8c"/>
        <path d="M11,25 A5,5 0 0,1 16,19 A7,7 0 0,1 26,17 A5,5 0 0,1 29,25 Z" fill="#ffffff"/>
      </g>
    </g>

    <!-- Bottom Feature Line -->
    <text x="100" y="325" fill="#9ec32e" font-family="monospace" font-size="12" font-weight="700">// ACTUALIZACIONES CONTINUAS + IA</text>
    <text x="100" y="348" fill="rgba(255,255,255,0.6)" font-family="system-ui, sans-serif" font-size="11">PC · Mac · iPad · iPhone · Android</text>

    <!-- Top Rim Highlight -->
    <polygon points="0,55 70,0 320,35 250,90" fill="#20334d" opacity="0.6"/>
  </g>

  <!-- Official Genuine Badge -->
  <g transform="translate(420, 80)">
    <circle cx="28" cy="28" r="26" fill="#0a1520" stroke="#0078d4" stroke-width="2"/>
    <text x="28" y="24" fill="#9ec32e" font-family="monospace" font-size="9" font-weight="800" text-anchor="middle">GENUINO</text>
    <text x="28" y="38" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">100%</text>
  </g>
</svg>